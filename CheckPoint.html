<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckPoint - Tambo Adventure Travel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/glassmorphism.css">
    <link rel="stylesheet" href="./css/palettes.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link rel="icon" type="image/png" href="logo tat coloured.png">
    <style>
        .checkpoint-container {
            padding: 4rem 2rem;
            text-align: center;
            margin-top: 5rem;
        }
    </style>
</head>
<body>
    <div id="particles-container"></div>
    <div class="app-container">
        <div class="glass-card checkpoint-container">
            <h1><i class="fas fa-check-circle" style="color: var(--accent-color);"></i> CheckPoint</h1>
            <p style="margin-top: 1rem; color: #EFE3D0;">Cette page sert de point de contrôle ou de page de statut pour des opérations spécifiques.</p>
            <p style="font-size: 0.9rem; color: #C9AE80;">Le contenu sera généré dynamiquement.</p>
            
            <div id="checkpoint-status" style="margin-top: 1.5rem; display: none;"></div>

            <input type="number" class="field-value" style="text-align: center; font-size: 1.5rem; max-width: 250px; margin: 2rem auto; display: block;" placeholder="0">
            <button id="submit-number-btn" class="glass-btn" style="margin: 1rem auto; display: block;">Envoyer le nombre</button>

            <a href="index.html" class="glass-btn" style="margin-top: 2rem;">Retour à l'accueil</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/checkpoint-manager.js"></script>
</body>
</html>
