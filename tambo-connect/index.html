<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambo Connect</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #07172b, #102c43);
        color: #e8f1ff;
        font-family: Arial, sans-serif;
      }
      .card {
        max-width: 640px;
        width: calc(100% - 2rem);
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 20px 45px rgba(0,0,0,0.25);
      }
      h1 { font-size: 1.8rem; margin: 0 0 0.75rem; }
      p { margin: 0; color: rgba(232,241,255,0.85); line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Tambo Connect</h1>
      <p>Ce mini-site est désormais accessible via /tambo-connect/.</p>
      <p>Le dossier d’entrée a été préparé au niveau racine du site pour respecter la structure attendue.</p>
    </div>
  </body>
</html>
